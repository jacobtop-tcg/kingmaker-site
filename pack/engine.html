<script type="text/markdown" id="src"># The register engine

The operating system behind the storefront. Everything the site promises — the Register, the Charter's mechanisms, the 1+1 rate card, the Standard's scores, the benchmark — runs here as code, not as prose. No dependencies, no external services; data is one JSON file per entity in this directory, which means it is private, versionable, GDPR-erasable, and operable by Claude in any session on this project ("add the engineer I just met", "what invoices are due", "generate the dossier for the n8n search").

```bash
node scripts/kingmaker.mjs help
```

## What it enforces (not just records)

| Rule from the brand | Enforcement |
|---|---|
| k-anonymity: no dossier describes fewer than 5 plausible people | `dossier` counts the register pool matching every disclosed attribute (standing + role band + segment + market, casefolded) and refuses below k=5, telling you what to coarsen |
| Double opt-in | `dossier` refuses without both the engineer's approval to be introduced and approval of the exact dossier text |
| Never approached below the stated bar | `propose` refuses when the search OTE is under the engineer's comp floor |
| Per-company blocklists | `propose` refuses blocked companies |
| Only the Represented and Fellows are proposed | `propose` checks standing; `vet` applies the admission thresholds (no dimension below 3, mean 3.4+) |
| The 1+1 rate card | `open-search` computes both installments (OTE/12 each, €20k minimum total); `advance --to placed` sets due dates (start date, +6 months, month-end clamped); `advance --to failed` applies the waiver rules: waived on resignation/cause, still due on client-side events; `invoice` refuses waived installments, validates the installment number, and requires placement first |
| Searches move forward only | `advance` enforces the state machine (signed to shortlist to offer to placed to failed; lost only pre-placement): no failing an unplaced search, no re-placing, no invoicing from limbo |
| "Approved the exact text" is literal | dossier-text approval binds a hash of the rendered dossier; if the record changes afterwards, generation refuses until the engineer re-approves |
| Org score travels with every search | `open-search` requires the company to be scored first and freezes the score at signing |
| Benchmark never deanonymizes | `benchmark` separates currencies, suppresses every cell below n=5 without even naming it, emits rounded p25-p75 bands instead of raw min/max, and labels verified vs self-reported |
| Right to erasure | `erase --confirm` deletes the record, scrubs every search's shortlist and log references, and deletes generated dossier files (whose names are hashed, never name-derived) |

## A day in the life

```bash
# After a vetting coffee: capture the engineer + the comp instrument in one line each
node scripts/kingmaker.mjs add-engineer --name "..." --role-band "Senior Sales Engineer" --segment "Enterprise SaaS" --market "Northern Europe" --comp-floor 150000
node scripts/kingmaker.mjs vet --engineer <id> --scores 4,5,4,3,4 --base 105000 --ote 150000 --ratio 1:3 --reference "AE name, the Vestas deal" --verified

# A company wants to hire: score the org first, then sign
node scripts/kingmaker.mjs score-org --company "n8n" --scores 8,7,6,9,8,7,8,9,7,8
node scripts/kingmaker.mjs open-search --company <id> --role "Senior SE" --ote 145000 --track inventory

# The search: propose, get consents, generate the dossier, place
node scripts/kingmaker.mjs propose --search <sid> --engineer <eid>
node scripts/kingmaker.mjs approve --search <sid> --engineer <eid> --dossier-text-approved
node scripts/kingmaker.mjs dossier --search <sid> --engineer <eid>      # writes ops/register/out/dossier-*.html
node scripts/kingmaker.mjs advance --search <sid> --to placed --start-date 2026-11-01

# Money and truth
node scripts/kingmaker.mjs installments    # what is due, upcoming, waived + survival rate
node scripts/kingmaker.mjs pipeline        # the whole house on one screen
node scripts/kingmaker.mjs benchmark       # the data moat, k-suppressed
```

## Tests

```bash
node scripts/kingmaker.test.mjs
```

48 assertions across vetting thresholds, intake-status whitelisting, org bands, fee math and its boundary, input validation, charter enforcement with normalized blocklists, double opt-in, text-hash approvals, standing-conditioned k-anonymity, the search state machine, month-end installment dates, waiver rules, benchmark banding and suppression, GDPR erasure residue, and id validation. Hardened against a 3-lens adversarial review (correctness, privacy red-team, test adequacy). Wired into `GATES.md` as gate G17.

## Boundaries, stated honestly

- This directory starts empty. The engine ships with zero fabricated data; it fills up one real conversation at a time.
- The public site's intake stays email on purpose: the artifact platform's database capability makes a page organization-internal, which would lock out the very candidates and clients the site exists to reach. Email in, engine behind — that is the concierge model the strategy chose.
- The `out/` directory holds generated dossiers and benchmarks; treat it as confidential output, and clear it when files are no longer needed.
- When volume outgrows files (hundreds of engineers, multiple operators), the migration path is the same data model into Airtable or a small backend; the commands are the spec.
