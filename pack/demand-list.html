<script type="text/markdown" id="src"># Kingmaker — Named-Account Demand List

**Purpose:** operational call list of companies with live or recent Sales Engineer / Solutions Engineer / Solutions Consultant / Presales / FDE requisitions in Kingmaker's launch geography (Copenhagen, Stockholm, Oslo, Helsinki, Berlin, Amsterdam, London, EU-remote).
**Compiled:** 31 August 2026, from public job boards, ATS pages and company career sites. Every row traces to a source actually found on that date — nothing here is assumed.
**Rule before any call:** re-verify the req on the company's own careers page the same morning. Job-board aggregators lag by days to weeks. Status column tells you how much checking each row needs.

Status key:

| Status | Meaning |
|---|---|
| **Live — verified** | Seen on the company's own ATS/careers page or a fetch of a live board, 31 Aug 2026 |
| **Live — dated Aug 2026** | Dated posting found via job board this month; re-verify before calling |
| **Recent — reverify** | Found via aggregator, posting date unclear; could be weeks old |
| **Signal only** | Company is plainly scaling GTM but no SE/FDE req confirmed; treat as prospecting, not demand |
| **Stale** | Req confirmed expired; listed because it proves the company hires this role |

## 2. Top-10 priority ranking — first concierge wave from Copenhagen

Ranked for the founding phase: 5–8 exclusive searches on the 1+1 rate card (one month of OTE at start, one at the six-month anniversary; €20k minimum), traded for a named case study. Criteria: (a) req verified or near-verified, (b) no entrenched SE-recruiting muscle, (c) profile scarce enough that generalist agencies fail, (d) case-study value, (e) reachability from Copenhagen.

| Rank | Company | Req | Why this rank | Entry angle |
|---|---|---|---|---|
| 1 | **All Gravy** (CPH) | Solutions Engineer | Only verified live SE req headquartered in Copenhagen; founder-reachable; a placement here is the fastest possible first proof point | Direct founder intro; offer the 7-day shortlist SLA from inventory; walk over |
| 2 | **Legora** (STO) | Solutions Engineer + FDE | Two open customer-facing-engineer reqs; legal-AI SEs barely exist as a labour pool — evidence-vetting is the pitch; prestige case study | Approach Head of Sales/GTM; lead with the 5-dimension rubric and k-anonymous dossier sample |
| 3 | **n8n** (BER) | FDE — EMEA, FDE Lead, Senior SE | Three reqs in one family plus a function being built from scratch; supports both search revenue and the FDE-advisory pillar | Pitch the FDE Lead search as retained + advisory on the FDE org design; honest SLA: 3–4 weeks for passive leads |
| 4 | **Cognite** (OSL) | Pre-sales Engineer | Nordics have zero SE-specialist recruiters — Cognite is the flagship proof of that gap; industrial+presales profile is genuinely hard | Verify req first (aggregator-sourced); approach VP Presales/CRO with a named-profile teaser |
| 5 | **Qdrant** (remote EU) | SE — EMEA | Fresh Series B, first field hires, remote-first so the whole Register is in scope | Founder/CRO outreach; vector-DB SEs from Elastic/Mongo/Neo4j orbits are exactly Register stock |
| 6 | **Drata** (LON) | SE + Senior SE | Two simultaneous reqs; US TA without EU SE bench; compliance-SaaS SEs are a known scarce pool | Approach EMEA sales leadership; re-verify reqs on drata.com first |
| 7 | **Funnel** (STO) | Solutions Consultant | Verified on their own ATS; mid-level (2–4 yrs) so shortlist can come largely from inventory — fast win, modest fee | Hiring manager outreach; emphasise 7-day shortlist |
| 8 | **PolyAI** (LON) | Forward Deployed AI Engineer | FDE-practice case study in conversational AI; London density of SEs helps | Confirm the req sits in London before pitching; approach VP Customer/Deployment |
| 9 | **RELEX** (HEL) | Technical Consultant / Solution Consultant bench | Standing multi-req demand; Finland uncovered by specialists; higher volume, lower glamour — good revenue ballast | Approach presales director; position as ongoing exclusive pipeline, not one-off |
| 10 | **Clera** (BER) | FDE | Small fee, high narrative value: a named FDE placement at a Berlin AI startup within weeks of launch | Founder-to-founder; price honestly at launch terms; only if it does not displace ranks 1–6 |

## 3. Data quality notes — read before dialling

1. **Verified today vs. snippet-sourced.** Rows marked *Live — verified* were seen on a company ATS or a successfully fetched board on 31 Aug 2026 (Funnel, Grafana, Salesforce, OpenAI, Adyen, Mistral/Lever, All Gravy/The Hub, Databricks and Cisco via the London board fetch). Everything else came through aggregator snippets and **must** be re-confirmed on the company's own page before outreach.
2. **Known-stale rows** (DataSnipper, Trustpilot, Templafy) are included only as proof the company hires the role. Do not reference the dead req in outreach; ask about the function.
3. **Location ambiguity.** PolyAI's FDE req may be New York; Zendesk's Senior Sales Engineer req is likely US-remote; n8n's Senior SE req may be US-scoped (the FDE — EMEA req is confirmed Europe). Confirm geography before counting any of these as EU demand.
4. **Aggregator date inflation.** Glassdoor/ZipRecruiter pages titled "August 2026" often contain older postings. A page date is not a posting date. The only dates trusted in this file are per-posting dates (Drata 12 Aug, Albatross 17 Aug, Clera 27 Aug, Zendesk 6 Jul).
5. **Coverage gaps.** Oslo and Helsinki returned thin verified results in this pass — consistent with the no-specialist-recruiter thesis, but also with job-board under-indexing of Nordic ATSs (Teamtailor, Jobylon). Next pass: query Teamtailor-hosted career pages directly, plus Finn.no (NO) and Jobindex (DK).
6. **Not searched yet:** Paris, Munich, Zurich, Dublin — all showed incidental demand (OpenAI FDE postings span Munich/Paris/Dublin; Stepstone shows Munich presales-architect volume). Expand the list when the first wave is booked.
7. **Refresh cadence.** This list decays fast — FDE postings are up ~800% YoY and reqs close in weeks. Re-run the sweep every Monday; move rows between tables rather than deleting, so the history of who hires this role accumulates into Register intelligence.
