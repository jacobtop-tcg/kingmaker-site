<script type="text/markdown" id="src"># The Kingmaker intake form (v0.1 — the founders' working parameter set)

**Status: living document, owned by both founders.** Daniel's principle governs it: engineers are vetted against the parameters *we* decide actually matter. Strike, add, and reweight together as the pool teaches you; the engine follows whatever the two of you land on.

The "detailed form" for the pool-first phase: everything the house needs to know an engineer properly, mapped one-to-one to the register engine and the vetting rubric. Use it three ways: as the founders' interview sheet during the structured hour, as a form the engineer fills before or after the conversation (copy the questions into a Google Form or send this document), or as the checklist for `add-engineer` + `vet`. Everything self-reported is labeled **attested** in the dataset until a document is seen; nothing here is an exam.

Fields marked → map directly to engine flags.

---

## 1. Who you are

- Full name → `--name`
- Email and phone → `--email`
- LinkedIn URL
- Base city and country
- Languages you sell in

## 2. The work

- Current title and company (held confidentially; your employer goes straight onto your blocklist if you wish)
- Role band (pick the closest): Sales Engineer / Senior SE / Principal or Staff SE / Solutions Consultant / Solutions Architect / Forward Deployed Engineer / SE Manager / Head or Director / VP → `--role-band`
- Segment you know best (e.g. enterprise SaaS, cybersecurity, infrastructure, data/AI platforms) → `--segment`
- Market you work (e.g. Northern Europe, DACH, UK, US remote) → `--market`
- Years in customer-facing engineering
- Internal track (founders fill, never shown publicly): core / senior / fde → `--track`

## 3. The evidence (this is the dossier's raw material)

- One technical win you are proud of: the deal, what tipped it, and your part in it, in five sentences
- Who can vouch for it: an AE or a customer we may call (name + relationship) → `vet --reference`
- Attainment: how you have performed against plan the last 2-3 years (President's Club, awards, percentiles; documents only if and when it benefits you) → `vet --attainment`
- Anything public that shows the craft (a talk, a certification, a community role)

## 4. The compensation instrument (attested until a document is seen)

- Current base → `vet --base`
- Current OTE at 100% attainment → `vet --ote`
- Currency → `vet --currency`
- Equity or other material comp, in your own words → `vet --equity`
- AE:SE ratio where you work → `vet --ratio`
- Demo/presales tooling you rate or hate → `vet --tooling`

## 5. Your bar (the Charter's enforcement data: we never approach below it)

- Compensation floor for even hearing about a role → `--comp-floor` + currency
- Titles or scope you would move for
- Segments you want, segments you are done with
- Travel ceiling (days per month)
- IC or leadership, or either
- Companies that must never learn of you → `block --company`, one per line
- How you want to be contacted, and how often is too often

## 6. Consents (GDPR, plain terms)

- [ ] I consent to Kingmaker holding the data above for the life of my representation (erasable in full, any time)
- [ ] My name may appear on the consented founding roll (optional)
- [ ] Contact me about the Register's compensation aggregates when they publish (optional)

## 7. The founders' sheet (never sent to the engineer)

- Rubric 1-5, whole numbers, quote-backed at 4+: discovery / technical credibility / storytelling / objection handling / commercial awareness → `vet --scores d,t,s,o,c`
- Nominated by → `nominate --by`
- Admission thresholds (provisional, for joint revision): no dimension below 3, mean 3.4+. Below threshold: status stays vetting, and that is never communicated as a rejection.

---

**Engine round trip for a completed form:**

```bash
node scripts/kingmaker.mjs add-engineer --name "..." --role-band "..." --segment "..." --market "..." --track senior --comp-floor 150000
node scripts/kingmaker.mjs block --engineer <id> --company "Current Employer A/S"
node scripts/kingmaker.mjs vet --engineer <id> --scores 4,4,5,3,4 --base 105000 --ote 150000 --ratio 1:3 --reference "AE name, the deal" --attainment "Club FY24, FY25"
```
