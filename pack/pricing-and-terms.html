<script type="text/markdown" id="src"># Kingmaker — Pricing & Commercial Terms

**Status:** Operating document. Version 2.1, August 2026. Owner: Jacob.
**v2 change (founder-set):** all permanent search runs on the 1+1 model: one month of the hire's OTE at start date, one more at the six-month anniversary. It replaces the lighthouse/target percentage ladder as the standard rate card. Retained thirds survive only as an option for confidential or complex leadership mandates.
**v2.1 change (founder-adopted, August 2026):** a €5,000 commencement fee opens every search, invoiced at signature and credited in full against installment 1. Both installments are issued as invoices at start date; installment 2 is payable at the 6-month anniversary plus 14 days and waived by credit note only. Leadership searches default to 1.5 + 1.5 months of OTE; employers holding the endorsed mark (org score 80+) keep the 1+1 rate on leadership. The retained option is available whenever a client requests confidentiality or prefers it.
**Use:** Reference in every commercial conversation. Quote nothing that is not on this sheet. If a client asks for terms not listed here, the answer is "let me come back to you", not improvisation.

---

## 0. Rate card at a glance

| Product | Fee | Minimum | Payment trigger | Available from |
|---|---|---|---|---|
| Commencement fee (every search) | **€5,000** (or equivalent in the search currency), credited in full against installment 1 | — | Invoiced at signature, 14-day terms. Non-refundable. Beyond it, nothing is invoiced before the hire's start date | Now |
| Engaged search (IC) | **1 month of OTE at start + 1 month at the 6-month anniversary** (≈16.7% of first-year OTE) | €20,000 total | Both installments issued as invoices at start date; installment 2 payable at the 6-month anniversary plus 14 days | Now |
| Leadership search | **1.5 months of OTE at start + 1.5 months at the 6-month anniversary** (≈25% of first-year OTE). Employers holding the endorsed mark (org score 80+) keep the 1+1 rate | €20,000 total | Same as engaged search | Now |
| Leadership, retained option | 30–33% of first-year OTE, in thirds | €50,000 (EU) | Signature / shortlist / placement | Now, whenever a client requests confidentiality or prefers it |
| Talent Partner subscription | €3–5k / month; second installment reduced to half a month on subscribed searches | 6-month term | Monthly in advance | ~Month 9 |
| Fractional / contract SE bench | 18–22% markup on day rate | — | Monthly invoicing | Month 9–12 |

All fees exclusive of VAT. There is no refund anywhere in the model: the commencement fee is credited against installment 1, never returned, and the credit-note waiver on installment 2 IS the client's risk protection (Section 1.3).

---

## 1. Permanent search — IC practice

### 1.1 The Kingmaker terms: 1 + 1

The whole rate card, quotable in one sentence: *"You pay one month of their OTE when they start, and one more once they have stayed six months."* A €5,000 commencement fee opens the search at signature and is credited in full against installment 1; beyond it, nothing is invoiced before the hire's start date.

| Term | Rule |
|---|---|
| Fee | 1 month of first-year OTE at start date + 1 month at the 6-month anniversary of the start date |
| Commencement fee | €5,000 (or equivalent in the search currency), invoiced at signature, 14-day terms. Non-refundable, credited in full against installment 1. It prices abandonment and converts exclusivity from favor to purchase |
| OTE basis | **Cash compensation at offer**: annual base + annual target variable at 100% attainment, exactly as written in the signed offer. Excludes equity/options, sign-on bonus, benefits, pension, car. The number is locked at offer; later raises or cuts do not reprice either installment |
| Minimum fee | €20,000 total (€10,000 per installment); protects junior/mid briefs, invisible on senior ones |
| Payment | Both installments issued as invoices at start date. Installment 1 payable on 14-day terms, net of the €5,000 commencement credit. Installment 2 earned in full at start date, payable at the 6-month anniversary plus 14 days |
| Second installment waived | **Only** if the hire voluntarily resigns, or is dismissed for cause, before the 6-month anniversary. The waiver is executed as a credit note against the standing installment-2 invoice, never a chased new one |
| Second installment still payable | Redundancy, restructure, material change to the role, or change of manager within the period. Client-side events do not cancel the fee |
| Exclusivity | Required, always. Engaged and exclusive on the role |
| Founding clients | Same 1+1 terms; the trade for early clients is the named case study, quote, and two reference calls (contractual, Section 6.1 clause 11), not a discount. The model is already the low-barrier offer |

**Why this model (say it to clients):** no percentage haggling, no engagement-fee negotiation, fee scales automatically with the candidate's level, and half the money is at risk on the hire actually sticking. It prices our own vetting.

**Price path (internal):** hold IC pricing at 1+1 through the first 10+ placements. Then either move IC to 1¼ + 1¼ months (≈20.8% of OTE), or keep 1+1 as the privileged IC rate for clients holding the endorsed-employer mark, as leadership pricing already does (Section 2). Decide at placement 10, not before.

**Anti-gaming rules:** if a client restructures an offer to shift cash into sign-on or equity after seeing the fee basis, the fee is calculated on the pre-restructure package (clause it, Section 6.1.3). Quote nothing off-card.

### 1.2 Two-track SLA — stated on day one, in the agreement

| Track | Commitment | When it applies |
|---|---|---|
| Register inventory | Shortlist of 3–5 vetted, interested members within **7 calendar days** of signed brief | The brief matches members already vetted and open to the right approach |
| Passive approach | Shortlist within **3–4 weeks** | The brief requires approaching passive members or mapping beyond current inventory |

- State which track applies before signature, not after. If it is genuinely unclear, quote the passive track and beat it.
- Never quote 7 days to win the deal and deliver in 4 weeks. The SLA is a proof point; missed once in writing, it is a liability forever.

### 1.3 Risk protection — the deferred installment IS the guarantee

| Element | Rule |
|---|---|
| Core protection | If the hire voluntarily resigns or is dismissed for cause inside 6 months, the second installment never falls payable. The client's downside on a failed hire is one month, not two |
| Waiver mechanics | Both installments exist as invoices from start date; installment 2 is earned in full at start date and payable at the 6-month anniversary plus 14 days. A qualifying departure triggers a credit note against that standing invoice. A waiver is a credit note against an existing invoice, never a chased new one |
| Replacement search | Offered after any waived second installment: same brief, priority SLA, priced at **one additional month of OTE** on the replacement's start (so a made-good failure still totals 2 months, never more) |
| Refunds | Never. The credit-note mechanism removes the refund debate by construction; the commencement fee and installment 1 are payment for delivered work. Refund-language demands remain a walk-away criterion (Section 7.2) |
| Conditions | Fees paid on time; client engaged with onboarding; departure not caused by client-side events (see 1.1) |
| One make-good per placement | A second failure triggers a joint post-mortem, not another free search |

## 2. Leadership practice

**Default: 1.5 + 1.5 months of OTE** (≈25% of first-year OTE): 1.5 months at start date, 1.5 months at the 6-month anniversary, on the same commencement, invoicing, and credit-note terms as Section 1.1. A Head of Presales at €220k OTE prices at €27,500 per installment, €55,000 total; a US VP at $420k cash at $52,500 per installment, $105,000 total. The pricing stays OTE-based and quotable in one sentence; the founder has bought a leadership hire on an OTE-months model, and it sells.

**Endorsed privilege:** employers holding the endorsed mark (org score 80+) keep the 1+1 rate on leadership searches (the €220k Head of Presales drops to €18,333 per installment, €36,667 total). This is the Standard's commercial teeth: the rate exists so the mark is worth earning.

**Retained option (30–33% in thirds, €50k minimum):** available whenever the client requests confidentiality or simply prefers the structure: unannounced replacement, new-market build-out, CRO-adjacent scope, guaranteed dedicated bandwidth. Retained thirds are non-refundable stage payments for work performed (Section 6.2). A payment structure is not a track-record claim; the option is on the table from day one, offered, not pushed.

- Roles covered: first SE hire who will build the team, SE Manager, Head of Solutions Consulting, Director/VP Presales, Head of FDE.
- Internal economics note, reviewed at placement 10: leadership searches cost 2–3× the hours of an IC search. If leadership searches at 1.5 + 1.5 still crowd out IC volume at these hours, steer complex mandates to the retained option.

## 3. Talent Partner subscription (from ~month 9)

A standing relationship for clients hiring 3+ SEs per year. Do not sell before the register is deep enough to honour priority access — realistically month 9 at the earliest.

| Element | Terms |
|---|---|
| Fee | €3,000–5,000 per month, tiered by hiring volume and geography |
| Term | 6 months minimum, then rolling quarterly |
| Success fee | Second installment reduced to half a month on subscribed searches (total ≈1.5 months of OTE) |
| Concurrency | Priority handling of up to two concurrent searches |
| Priority access | Subscriber briefs are matched against new register members before the open market sees them |
| Compensation benchmarking | Quarterly comp review for the client's SE org against verified register data |
| Org diagnostic | One SE-Org Health Check per year included, rescored on request |

**Discipline:** the subscription must never become a cheap way to buy unlimited search. Cap it — subscription pricing assumes up to a stated number of concurrent searches (typically two); beyond that, additional searches at 20%. Put the cap in the agreement.

---

## 4. Fractional / contract SE bench (month 9–12)

For clients needing senior presales capacity without a permanent hire: coverage for parental leave, a strategic deal, an FDE pilot, a first-SE trial before committing to headcount.

| Element | Terms |
|---|---|
| Model | Kingmaker contracts the SE (or their company) and invoices the client |
| Markup | 18–22% on the day rate, **disclosed to both sides** — transparency is the differentiator against the 40–60% margins of generalist contract shops |
| Invoicing | Monthly, 14-day terms, timesheet-backed |
| Conversion | Contract-to-permanent: the 1+1 fee, with installment 1 reduced by one-sixth per full month contracted; floor one month of OTE total |
| Candidate terms | The SE sees the client rate and the markup. No opaque spread, ever |

**Regulatory gate — Germany (and check per country):** placing contractors into German clients under this model is almost certainly *Arbeitnehmerüberlassung* (labour leasing) and requires an **AÜG licence** from the Bundesagentur für Arbeit. Operating without one voids contracts and creates deemed-employment liability for the client.
**Rule: no fractional placement into DACH until legal counsel has confirmed the structure — licence obtained, genuine contractor-of-record structure, or a licensed local partner.** Similar regimes exist elsewhere (e.g. AUB in the Netherlands is lighter; Sweden and Norway have their own rules). One legal memo per country before the first placement in it.

## 5. Unit economics — worked examples (1+1 IC, 1.5+1.5 leadership)

Assumed FX for planning: £1 ≈ €1.16, $1 ≈ €0.92. Update quarterly.

| Case | OTE | Per installment | Total fee | Cash at start | Cash at month ~6.5 |
|---|---|---|---|---|---|
| Copenhagen, senior SE | €147,000 | €12,250 | **€24,500** | €12,250 | €12,250 |
| London, senior SE | £120,000 | £10,000 | **£20,000 ≈ €23,200** | £10,000 | £10,000 |
| US-remote, senior SE | $240,000 | $20,000 | **$40,000 ≈ €36,800** | $20,000 | $20,000 |
| EU Head of Presales (1.5 + 1.5) | €220,000 | €27,500 | **€55,000** | €27,500 | €27,500 |
| EU Head of Presales, endorsed employer (1 + 1) | €220,000 | €18,333 | **€36,667** | €18,333 | €18,333 |
| US VP Presales, cash comp (1.5 + 1.5) | $420,000 | $52,500 | **$105,000 ≈ €96,600** | $52,500 | $52,500 |
| Mid-level brief below the floor | €108,000 | €9,000 | **€20,000 (minimum)** | €10,000 | €10,000 |

**Commencement and net installments:** every search also invoices a €5,000 commencement fee (or the equivalent in the search currency) at signature, credited in full against installment 1. The "cash at start" column therefore splits in practice: €5,000 arrives at signature, and installment 1 net of that credit arrives at start date. Totals are unchanged; timing moves forward, and an abandoned search still leaves €5,000 collected.

Read the cash column twice: **half of every fee lands roughly 7 months after the start date** (6-month anniversary plus 14 days), which is 9–12 months after signature. US searches remain worth roughly 1.5 Copenhagen searches; leadership at 1.5 + 1.5 roughly 2–4×.

## 6. Term-sheet skeletons

Clause lists for counsel to draft from. Not legalese; nothing here is issued to a client without legal review.

### 6.1 Engaged Search Agreement (IC)

1. **Parties, role, and brief** — role title, level, location/remote policy, comp band, the written brief as an appendix; changes to the brief re-open the SLA clock.
2. **Exclusivity** — Kingmaker is the sole external agency on the role for the search period (90 days, renewable); client-sourced direct applicants excluded but disclosed weekly.
3. **Fees and payment** — commencement fee of €5,000 (or the equivalent in the search currency): invoiced at signature, 14-day terms, non-refundable, credited in full against installment 1; beyond it, no invoice is issued before the hire's start date. The 1+1 model (leadership: 1.5 + 1.5, or 1+1 for employers holding the endorsed mark): fee basis defined precisely (OTE = annual base + annual target variable at 100% attainment as written in the signed offer, excluding equity, sign-on, benefits, pension, car; locked at offer); both installments issued as invoices at start date (installment 1 payable on 14-day terms net of the commencement credit; installment 2 earned in full at start date, payable at the 6-month anniversary plus 14 days); €20,000 minimum, late-payment interest; anti-restructuring clause (fee calculated on the pre-restructure package if cash is shifted to sign-on/equity after fee disclosure).
4. **SLA and track statement** — which track (7-day inventory / 3–4 week passive) applies, stated in the agreement.
5. **Second-installment waiver and make-good** — installment 2 is earned in full at start date, payable at the 6-month anniversary plus 14 days, waived only on voluntary resignation or dismissal for cause before that date; the waiver is executed as a credit note against the standing installment-2 invoice, never a new invoice; client-side events (redundancy, restructure, role change, manager change) keep it payable; replacement search after a waiver priced at one additional month, one make-good per placement (Section 1.3).
6. **Dual-agency disclosure** — Kingmaker represents candidates under a Candidate Charter and is paid by the client; both facts disclosed to both sides; no fee-motivated steering, with the Charter's named remedy referenced.
7. **Candidate ownership and attribution** — a candidate introduced by Kingmaker is attributed to Kingmaker for 12 months from introduction, regardless of channel of eventual hire; introduction defined as named dossier delivery.
8. **Off-limits / non-solicitation** — Kingmaker will not approach any candidate it has placed at the client for **24 months** from start date; client will not solicit Kingmaker staff or directly re-engage register members introduced on this search for other roles without a fee.
9. **Data protection (GDPR)** — lawful basis; Kingmaker as controller of register data, client as controller of received dossiers; k-anonymised dossiers pre-NDA; deletion of unsuccessful-candidate data on request and within defined retention; no onward transfer of dossiers.
10. **Confidentiality and NDA-before-reveal** — client signs candidate NDA before identity reveal; search confidentiality mutual.
11. **Case-study clause** *(lighthouse only)* — named case study, quote, two reference calls; deliverable within 60 days of placement.
12. **Term, termination, and abandonment** — either party on 14 days' notice; if the client fills the role with a Kingmaker-introduced candidate within the attribution window after termination, the full fee falls due on that hire's start date; the commencement fee is non-refundable and retained on a client-abandoned search (it prices abandonment); beyond it, no fees accrue before a start date exists, and an abandoned search is still logged (it prices the relationship, Section 7.2).
13. **Liability cap, governing law, disputes.**

### 6.2 Retained Leadership Agreement

Everything in 6.1, plus or amended:

1. **Retainer structure** — thirds at signature / shortlist / start date; each instalment is payment for work performed and non-refundable; shortlist defined (minimum 3 qualified, interested, comp-aligned candidates with full dossiers).
2. **Search committee and cadence** — named client sponsor, weekly written progress report, fortnightly steering call.
3. **Market map deliverable** — client receives the anonymised market map even if the search terminates early.
4. **Backchannel referencing protocol** — scope and consent rules for referencing at leadership level.
5. **Off-limits (client-side)** — agreed list of companies Kingmaker will not approach for this search (client's partners, key customers).
6. **Parallel-search restriction** — client warrants no parallel external search on the role; breach converts instalments due and releases Kingmaker.
7. **Extended guarantee** — 6-month replacement standard; 12-month premium option priced at signature.

---

## 7. Discipline rules

### 7.1 Never non-exclusive contingency

No search is accepted on contingent, non-exclusive terms. Not for a lighthouse logo, not "just this once", not at 25%. Racing three contingency shops to an inbox is staffing; it destroys the SLA, the candidate promise, and the pricing floor simultaneously. The scripted response: *"We work engaged and exclusive because the model doesn't function otherwise — the 7-day SLA and the candidate protections both depend on it. If exclusivity isn't available, we're not the right partner for this role."*

### 7.2 Walk-away criteria — decline or disengage when

| Signal | Why it kills the search |
|---|---|
| Refuses exclusivity or insists on contingency | See 7.1 |
| Demands refund-based guarantee language | The deferred installment already carries the risk; refunds reprice delivered work to zero (1.3) |
| Comp band below the stated register bar for the level | Violates the Candidate Charter's "approaches only above stated bar" |
| Wants a mandatory recorded audition for candidates | Showcase is optional and candidate-owned, always |
| Won't take the SE-Org Health Check | Candidates see the score on every intro; no score, no intro |
| Hiring manager unavailable for a proper brief | The brief is the search; no brief, no SLA |
| More than one external agency already on the role | The role is burned in the candidate market |
| Fee haggling below the rate card (1+1 IC, 1.5 + 1.5 leadership) or the €20k minimum | The rate card is one sentence long; discounting it kills its power. The endorsed 1+1 leadership rate is earned via the org score, never negotiated. Volume concessions live in the subscription, nowhere else |
| Payment terms beyond 30 days or "pay when funded" | 90-day cash lag is already the plan's biggest risk (7.3) |

Walking away is a marketing event. Do it politely, in writing, and keep the door open at compliant terms.

### 7.3 Year-1 revenue model (1+1 IC, 1.5+1.5 leadership)

| Line | Assumption | Booked |
|---|---|---|
| IC placements | 6–8 completed at €23–37k total fee (mix of Copenhagen/London/US-remote) | €160–230k |
| Leadership placement | 1 at 1.5 + 1.5 (€55–98k depending on market; an endorsed employer at 1+1 lands lower) | €55–98k |
| **Year-1 booked total** | | **≈ €215–330k** |
| Of which collected in year 1 | Commencement fees at signature + installment 1 on everything + installment 2 only on H1 starts | **≈ €130–200k** |

Planning assumptions, stated plainly:

- **Commencement fees pull roughly €10–15k of year-1 cash forward.** €5,000 per signed search arrives at signature instead of waiting for a start date, and the fee is retained when a client abandons. It does not change booked totals on completed searches; it moves cash earlier and prices abandonment on the rest.

- **60% completion rate.** Closing 7 searches means signing 11–12. Pipeline maths run on signatures, revenue maths on completions. A signed search is not revenue.
- **The deferred half stretches the cash lag to 9–12 months from signature.** This is the price of the low-barrier pitch. It requires the 12–18 month personal runway to be real, and it makes early US-remote and leadership searches (bigger months) disproportionately valuable.
- **Capacity ceiling.** One founder-pair runs 4–6 concurrent searches at the stated SLA, no more. Revenue growth beyond that comes from mix (US, leadership, subscription) before headcount.
- **Quarterly review.** Re-forecast completion rate, average fee, and second-installment survival rate (target: 90%+ of installments billed) every quarter. If survival drops below 85%, the problem is vetting or org-scoring at intake, and it is existential; fix that before signing more.
